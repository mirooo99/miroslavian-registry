<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Citizens’ Register – Miroslavian Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e4;--card:#fffdf6;--ink:#0f1f3d;--mute:#5b6580;--gold:#b8892b;--crim:#8c1d2c;--ok:#2f6b3f;--line:#e0d6b8;--hd:#0f1f3d;--hdink:#f6f1e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;line-height:1.5}
header{background:var(--hd);color:var(--hdink);text-align:center;padding:2.5rem 1rem 2rem;border-bottom:4px solid var(--gold)}
header h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.6rem,5vw,2.6rem);margin:0 0 .4rem;color:var(--gold)}
header p{margin:0;opacity:.85}
main{max-width:900px;margin:0 auto;padding:1.5rem 1rem 3rem}
#q{width:100%;padding:.8rem 1rem;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:.6rem}
.count{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.list{display:grid;gap:.6rem}
.row{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;color:inherit;text-decoration:none}
.row:hover,.row:focus-visible{border-left-color:var(--crim);box-shadow:0 2px 8px rgba(15,31,61,.12)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--hd);color:var(--gold);display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-size:1.3rem;font-weight:700}
.row b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.1rem}
.pos{font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--crim)}
.arrow{margin-left:auto;color:var(--gold);font-size:1.4rem}
.back{display:inline-block;margin-bottom:1rem;color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--gold)}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:1.4rem}
.head{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.head .av{width:64px;height:64px;font-size:1.9rem}
.head h2{font-family:"Playfair Display",Georgia,serif;font-size:1.6rem;margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin-bottom:1.2rem}
.fact{border:1px solid var(--line);border-radius:6px;padding:.7rem .9rem}
.fact span{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fact b{font-size:1.05rem}
.ok{color:var(--ok)}
.bad{color:var(--crim)}
.panel h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:1.2rem 0 .5rem;border-top:1px solid var(--line);padding-top:.9rem}
.panel ul{list-style:none;margin:0;padding:0}
.panel li{display:flex;justify-content:space-between;gap:.8rem;padding:.35rem 0}
.panel a{color:var(--ink);text-decoration-color:var(--gold);text-underline-offset:3px}
.panel a:hover{color:var(--gold)}
.sub{color:var(--mute);font-size:.85rem}
.none{color:var(--mute);margin:0}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:0 1rem 2rem}
.ins{display:grid;gap:.8rem}
.in{display:flex;gap:.9rem;padding:.7rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.in a,.in b{font-weight:600}
.in p{margin:.25rem 0 0;font-size:.9rem}
.ph{flex:none;width:96px;height:96px;background:#fff;border-radius:6px;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph.empty{color:var(--gold);font-size:2rem}
.ty{margin-left:.5rem;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--crim)}
.badge{display:table;margin-top:.35rem;padding:.1rem .7rem;border:1px solid var(--gold);border-radius:999px;font-size:.8rem;font-weight:600}
.reg{font-family:ui-monospace,Menlo,monospace}
.panel .tl{--dot:#b8892b;border-left:2px solid var(--dot);margin-left:.4rem;padding-left:1.1rem}
.panel .tl li{display:block;position:relative;padding:.4rem 0}
.panel .tl li::before{content:"";position:absolute;left:-1.5rem;top:.85rem;width:10px;height:10px;border-radius:50%;background:var(--dot)}
.panel .tl li.now::before{box-shadow:0 0 0 4px color-mix(in srgb,var(--dot) 30%,transparent)}
.panel .tl{cursor:pointer}
.tlbtn{margin-top:.6rem;padding:.55rem 1.1rem;border:1px solid var(--gold);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tlbtn:hover{background:var(--hd);color:var(--gold)}
dialog{border:none;border-radius:12px;padding:0;width:calc(100% - 2rem);max-width:640px;max-height:85vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,40,.55)}
.tbox{padding:0 1.2rem 1.4rem}
.tstick{position:sticky;top:0;z-index:1;background:var(--bg);padding:1.2rem 0 .6rem}
.thead{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.7rem}
.thead h2{font-family:"Playfair Display",Georgia,serif;font-size:1.35rem;margin:0}
.thead .sub{display:block}
.tclose{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer}
.tline{list-style:none;margin:.4rem 0 0;padding:0 0 0 1.6rem;border-left:3px solid var(--dot,var(--gold))}
.tline li{position:relative;padding:0 0 1rem}
.tline li::before{content:"";position:absolute;box-sizing:border-box;left:calc(-1.6rem - 10px);top:.95rem;width:17px;height:17px;border-radius:50%;background:var(--dot,var(--gold));border:3px solid var(--bg)}
.tline li.now::before{box-shadow:0 0 0 4px color-mix(in srgb,var(--dot,var(--gold)) 30%,transparent)}
.k-citizenship{--dot:#2f6b3f}
.k-position{--dot:#b8892b}
.k-title{--dot:#5b3a8c}
.k-order{--dot:#8c1d2c}
.k-rank{--dot:#0f1f3d}
.tcard{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--dot,var(--gold));border-radius:8px;padding:.7rem .9rem}
.tcard img{flex:none;width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px}
.tcard b{display:block;font-size:1.02rem}
.tag{display:block;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dot,var(--gold))}
.panel .tl.tt{--dot:#5b3a8c}
.panel .tl.bb{--dot:#d9480f}
.k-ban{--dot:#d9480f}
.in{border-left:3px solid var(--dot,var(--line))}
.ty{color:var(--dot,var(--crim))}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem}
.tab{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.tab::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dot,var(--mute))}
.tab.k-all::before{background:conic-gradient(#2f6b3f 0 17%,#b8892b 0 33%,#5b3a8c 0 50%,#8c1d2c 0 67%,#0f1f3d 0 83%,#d9480f 0)}
.tab small{font-weight:400;opacity:.7}
.tab[aria-selected="true"]{background:var(--hd);border-color:var(--hd);color:var(--hdink)}
body{background:radial-gradient(1200px 500px at 50% -10%,#fff8e1 0,transparent 70%),repeating-linear-gradient(45deg,rgba(184,137,43,.05) 0 2px,transparent 2px 14px),var(--bg)}
header{position:relative;overflow:hidden;padding:2.2rem 1rem 2.6rem;background:radial-gradient(600px 220px at 50% 0,rgba(212,169,74,.28),transparent 70%),linear-gradient(180deg,#0b1730,#14264d);border-bottom:0}
header::before{content:"M";display:grid;place-items:center;width:78px;height:78px;margin:0 auto 1rem;border-radius:50%;border:3px double #d4a94a;color:#d4a94a;font:700 2.3rem "Playfair Display",Georgia,serif;background:radial-gradient(circle,#1f3a74,#0b1730);box-shadow:0 0 30px rgba(212,169,74,.45)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#8c1d2c,#d4a94a 25%,#f3d58a 50%,#d4a94a 75%,#8c1d2c)}
header h1{background:linear-gradient(180deg,#fff0c0,#d4a94a 55%,#a67c1f);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.04em;font-size:clamp(1.8rem,6vw,3rem)}
header p{letter-spacing:.18em;text-transform:uppercase;font-size:.8rem;opacity:.8}
#q{border-radius:999px;padding:.9rem 1.3rem;border:1px solid var(--gold);box-shadow:0 4px 18px rgba(15,31,61,.08)}
#q:focus{outline:none;box-shadow:0 0 0 4px rgba(184,137,43,.3)}
.row{border:1px solid var(--line);border-left:4px solid var(--gold);background:linear-gradient(90deg,#fffdf6,#fbf4e0);box-shadow:0 2px 6px rgba(15,31,61,.05);transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .45s both;animation-delay:calc(var(--i,0)*40ms)}
.row:hover,.row:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,31,61,.16);border-left-color:var(--crim);outline:none}
.arrow{transition:transform .2s}
.row:hover .arrow{transform:translateX(4px)}
.av{background:linear-gradient(135deg,#1f3a74,#0b1730);color:#f3d58a;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--gold)}
.panel{border-top:0;border-radius:14px;padding:0 1.4rem 1.4rem;overflow:hidden;box-shadow:0 18px 40px rgba(15,31,61,.14);animation:rise .45s both;background:linear-gradient(#fffdf6,#fbf6e6)}
.head{margin:0 -1.4rem 1.4rem;padding:1.8rem 1.4rem;background:radial-gradient(500px 200px at 20% 0,rgba(212,169,74,.3),transparent 70%),linear-gradient(135deg,#0b1730,#1b2f5c);color:#f6f1e4;border-bottom:4px solid var(--gold)}
.head .av{width:76px;height:76px;font-size:2.2rem;box-shadow:0 0 0 3px #0b1730,0 0 0 6px #d4a94a,0 0 24px rgba(212,169,74,.5)}
.head h2{font-size:clamp(1.5rem,5vw,2.1rem);background:linear-gradient(180deg,#fff0c0,#d4a94a);-webkit-background-clip:text;background-clip:text;color:transparent}
.head .pos{color:#f3b8c0;font-size:.9rem}
.head .badge{color:#f3d58a;border-color:#d4a94a;background:rgba(212,169,74,.12)}
.fact{background:linear-gradient(#fffdf6,#f9f1da);border-top:3px solid var(--gold);box-shadow:0 2px 8px rgba(15,31,61,.06);transition:transform .2s}
.fact:hover{transform:translateY(-2px)}
.panel h3{display:flex;align-items:center;gap:.7rem;border-top:0;padding-top:0;margin:1.8rem 0 .8rem;color:var(--ink);font-family:"Playfair Display",Georgia,serif;font-size:1rem;letter-spacing:.12em}
.panel h3::before{content:"✦";color:var(--gold)}
.panel h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.in{box-shadow:0 2px 8px rgba(15,31,61,.07)}
.tlbtn{background:linear-gradient(180deg,#1f3a74,#0b1730);color:#f3d58a;box-shadow:0 4px 14px rgba(15,31,61,.25);transition:transform .2s}
.tlbtn:hover{transform:translateY(-2px);background:linear-gradient(180deg,#2a4a8f,#12244b)}
dialog[open]{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
dialog::backdrop{backdrop-filter:blur(4px)}
.tcard{box-shadow:0 2px 8px rgba(15,31,61,.08)}
footer{padding-bottom:2.5rem}
footer::before{content:"✦ ✦ ✦";display:block;color:var(--gold);letter-spacing:.6em;margin-bottom:.5rem}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>

const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const fmt=s=>new Date(s).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
const span=(f,t)=>f?fmt(f)+" – "+(t?fmt(t):"Present"):(t?"Until "+fmt(t):"Current");
const today=()=>new Date().toISOString().slice(0,10);
const q=$("#q"),list=$("#list"),detail=$("#detail"),listView=$("#listView"),dlg=$("#tlDlg");

const PATH_ROUTES=true;
const key=c=>c.regNo.toLowerCase();
const href=c=>(PATH_ROUTES?"/":"#")+key(c);
const home=PATH_ROUTES?"/":"#";
function current(){
const k=(PATH_ROUTES?location.pathname:location.hash).replace(/^[#/]+|\/+$/g,"").toLowerCase();
return CITIZENS.find(x=>key(x)===k||x.id===k);
}

function renderList(){
const t=q.value.trim().toLowerCase();
const rows=CITIZENS.filter(c=>!t||c.name.toLowerCase().includes(t)||c.position.toLowerCase().includes(t));
list.replaceChildren();
rows.forEach((c,i)=>{
const a=el("a","row");a.style.setProperty("--i",Math.min(i,14));
a.href=href(c);a.dataset.route="1";
const w=el("div");
w.append(el("b",0,c.name),el("span","pos",c.position));
a.append(el("div","av",c.name.trim().charAt(0).toUpperCase()),w,el("span","arrow","›"));
list.append(a);
});
$("#count").textContent=rows.length?rows.length+" of "+CITIZENS.length+" citizens":"No citizens found.";
}

function fact(label,value,cls,sub){
const d=el("div","fact");
d.append(el("span",0,label),el("b",cls,value));
if(sub)d.append(el("div","sub",sub));
return d;
}

function renderDetail(c){
detail.replaceChildren();
const back=el("a","back","← All citizens");
back.href=home;back.dataset.route="1";
const p=el("div","panel");
const head=el("div","head");
const w=el("div");
w.append(el("h2",0,c.name),el("span","pos",c.position));
if(c.title!==c.position)w.append(el("span","badge",c.title));
head.append(el("div","av",c.name.trim().charAt(0).toUpperCase()),w);
const banned=c.bans.some(b=>!b.until||b.until>=today());
const ct=c.titles.find(t=>!t.to)||c.titles[c.titles.length-1];
const cp=c.history.find(h=>!h.to);
const facts=el("div","facts");
facts.append(
fact("Register no.",c.regNo,"reg"),
fact("Status",c.status,c.status==="Active"?"ok":""),
fact("Title",c.title,"",ct.from||ct.to?span(ct.from,ct.to):""),
fact("Position",c.position,"",cp&&(cp.from||cp.to)?span(cp.from,cp.to):""),
fact("Citizen since",fmt(c.since)),
fact("Standing",banned?"Active ban":"Good standing",banned?"bad":"ok"),
fact("Orders & ranks",String(c.orders.length))
);
p.append(head,facts,el("h3",0,"Position history"));
if(!c.history.length){p.append(el("p","none","No recorded positions."))}
else{p.append(histList(c.history,"position","Position",c,""))}
p.append(el("h3",0,"Title history"),histList(c.titles,"title","Title",c," tt"));
const tb=el("button","tlbtn","Open full timeline ›");
tb.type="button";
tb.onclick=()=>openTimeline(c);
p.append(tb,el("h3",0,"Orders & ranks"));
if(!c.orders.length){p.append(el("p","none","No orders or ranks."))}
else{
const g=el("div","ins");
c.orders.forEach(o=>{
const d=CATALOG[o.id]||{name:o.name||"Distinction",type:"Distinction"};
const n=el("div","in k-"+d.type.toLowerCase());
const ph=el("div",d.img?"ph":"ph empty");
if(d.img){const im=el("img");im.src=d.img;im.alt=d.name;im.loading="lazy";ph.append(im)}else{ph.textContent="★"}
const t=el("div");
const h=el("div");
let nm;
if(o.url){nm=el("a",0,d.name);nm.href=o.url;nm.target="_blank";nm.rel="noopener"}
else{nm=el("b",0,d.name)}
h.append(nm,el("span","ty",d.type));
t.append(h);
const parts=[];
if(o.date||o.until)parts.push(span(o.date,o.until));
else if(o.year)parts.push(String(o.year));
if(o.by)parts.push("Awarded by "+o.by);
if(parts.length)t.append(el("div","sub",parts.join(" · ")));
if(o.reason)t.append(el("p",0,o.reason));
n.append(ph,t);
g.append(n);
});
p.append(g);
}
p.append(el("h3",0,"Bans & penalties"));
if(!c.bans.length){p.append(el("p","none","No bans or penalties."))}
else{p.append(histList(banItems(c),"reason","Ban",c," bb"))}
detail.append(back,p);
}

const TABS=[{label:"All",kind:""},{label:"Citizenship",kind:"Citizenship"},{label:"Positions",kind:"Position"},{label:"Titles",kind:"Title"},{label:"Orders",kind:"Order"},{label:"Ranks",kind:"Rank"},{label:"Bans & penalties",kind:"Ban"}];

function histList(items,key,kind,c,cls){
const ul=el("ul","tl"+cls);
[...items].sort((a,b)=>(b.to||"9999").localeCompare(a.to||"9999")||(b.from||"").localeCompare(a.from||"")).forEach(h=>{
const li=el("li",(h.active!==undefined?h.active:!h.to)?"now":"");
li.append(el("b",0,h[key]),el("div","sub",span(h.from,h.to)+(h.note?" · "+h.note:"")));
ul.append(li);
});
ul.tabIndex=0;
ul.setAttribute("role","button");
ul.setAttribute("aria-label","Open "+kind.toLowerCase()+" timeline");
ul.onclick=()=>openTimeline(c,kind);
ul.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openTimeline(c,kind)}};
return ul;
}

function banItems(c){
return c.bans.map(b=>({reason:b.reason,from:b.from,to:b.until,note:(b.type||"Ban")+(b.until?"":" · Permanent"),active:!b.until||b.until>=today()}));
}

function timelineEvents(c){
const ev=[{kind:"Citizenship",label:"Became a citizen",from:c.since}];
c.history.forEach(h=>ev.push({kind:"Position",label:h.position,from:h.from,to:h.to}));
c.titles.forEach(t=>ev.push({kind:"Title",label:t.title,from:t.from,to:t.to}));
c.orders.forEach(o=>{
const d=CATALOG[o.id]||{name:o.name||"Distinction",type:"Order"};
ev.push({kind:d.type==="Rank"?"Rank":"Order",label:d.name,from:o.date,to:o.until,img:d.img,by:o.by});
});
c.bans.forEach(b=>ev.push({kind:"Ban",label:b.reason,from:b.from,to:b.until,type:b.type||"Ban",perm:!b.until,active:!b.until||b.until>=today()}));
return ev.sort((a,b)=>(b.from||b.to||"9999").localeCompare(a.from||a.to||"9999")||(a.kind==="Citizenship")-(b.kind==="Citizenship"));
}

function openTimeline(c,kind){
const ev=timelineEvents(c);
let active=kind||"";
const box=el("div","tbox");
const stick=el("div","tstick");
const hd=el("div","thead");
const w=el("div");
w.append(el("h2",0,c.name),el("span","sub",c.regNo+" · Timeline"));
const x=el("button","tclose","×");
x.type="button";
x.setAttribute("aria-label","Close");
x.onclick=()=>dlg.close();
hd.append(w,x);
const tabs=el("div","tabs");
tabs.setAttribute("role","tablist");
stick.append(hd,tabs);
const body=el("div");
function draw(){
tabs.replaceChildren();
TABS.forEach(tb=>{
const n=tb.kind?ev.filter(e=>e.kind===tb.kind).length:ev.length;
const b=el("button","tab k-"+(tb.kind?tb.kind.toLowerCase():"all"));
b.type="button";
b.setAttribute("role","tab");
b.setAttribute("aria-selected",String(tb.kind===active));
b.append(tb.label+" ",el("small",0,String(n)));
b.onclick=()=>{active=tb.kind;draw()};
tabs.append(b);
});
const rows=ev.filter(e=>!active||e.kind===active);
body.replaceChildren();
if(!rows.length){body.append(el("p","none","Nothing recorded yet."));return}
const ol=el("ol","tline"+(active?" k-"+active.toLowerCase():""));
rows.forEach(e=>{
const on=e.kind!=="Citizenship"&&(e.active!==undefined?e.active:!e.to);
const li=el("li","k-"+e.kind.toLowerCase()+(on?" now":""));
const card=el("div","tcard");
if(e.img){const im=el("img");im.src=e.img;im.alt=e.label;card.append(im)}
const t=el("div");
t.append(el("span","tag",e.type||e.kind),el("b",0,e.label),el("div","sub",e.kind==="Citizenship"?fmt(e.from):span(e.from,e.to)+(e.perm?" · Permanent":"")));
if(e.by)t.append(el("div","sub","Awarded by "+e.by));
card.append(t);
li.append(card);
ol.append(li);
});
body.append(ol);
}
box.append(stick,body);
dlg.replaceChildren(box);
draw();
dlg.showModal();
}

function route(){
const c=current();
if(dlg.open)dlg.close();
listView.hidden=!!c;
detail.hidden=!c;
if(c){renderDetail(c);scrollTo(0,0)}
document.title=c?c.name+" ("+c.regNo+") – Citizens’ Register":"Citizens’ Register – Miroslavian Empire";
}

q.addEventListener("input",renderList);
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
addEventListener("hashchange",route);
addEventListener("popstate",route);
document.addEventListener("click",e=>{
const a=e.target.closest("a[data-route]");
if(PATH_ROUTES&&a&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){e.preventDefault();history.pushState(null,"",a.getAttribute("href"));route()}
});
renderList();
route();
</script>
</body>
</html>
